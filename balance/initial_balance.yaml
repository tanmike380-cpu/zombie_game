supply_rules:
  defensive_buildings_use_shared_stockpile: true
  manual_ammo_logistics_v1: false
  description_zh: "防御建筑直接消耗全阵营共享箭矢/火药，不做弹药箱、口径和人工搬运。"
  description_en: "Defensive buildings consume the faction-wide Arrow/Gunpowder stockpile directly; V1 has no ammo crates, calibers, or manual delivery logistics."
