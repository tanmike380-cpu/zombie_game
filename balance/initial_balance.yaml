  firearm_infantry:
    name_zh: "神机营"
    name_en: "Firearm Infantry / Shenji Battalion"
    class: ranged
    move_speed_tiles_per_sec: 2.8
    attack_range_tiles: 7
    ammo_type: gunpowder
    ammo_per_attack: 1
    noise_radius_tiles: 14
