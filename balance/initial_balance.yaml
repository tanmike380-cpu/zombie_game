  heavy_ballista:
    name_zh: "重弩炮"
    name_en: "Heavy Ballista"
    class: siege
    move_speed_tiles_per_sec: 1.5
    attack_range_tiles: 10
    ammo_type: arrows
    ammo_per_attack: 10
    noise_radius_tiles: 20
    role_key: heavy_projectile
    cost_focus: [wood, iron]

  cannon:
    name_zh: "火炮"
