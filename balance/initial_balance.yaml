meta:
  status: prototype
  note_zh: "所有数值均为原型测试占位值，不代表最终平衡。"
  note_en: "All values are placeholders for prototype testing. Do not treat them as final balance."
  localization_rule_zh: "机器键保持英文；所有面向人的名称和说明同时提供 zh-CN 与 en。"
  localization_rule_en: "Machine keys stay in English; all human-facing names and descriptions provide both zh-CN and en."

resources:
  food:
    name_zh: "粮食"
    name_en: "Food"
    category: base
    role_key: recruitment_and_population
    role_zh: "人口发展与单位招募"
    role_en: "Recruitment and population growth"
  wood:
    name_zh: "木材"
    name_en: "Wood"
    category: base
    role_key: buildings_and_arrow_supply
    role_zh: "普通建筑与箭矢军需"
    role_en: "Buildings and arrow supply"
  stone:
    name_zh: "石料"
    name_en: "Stone"
    category: base
    role_key: defensive_buildings
    role_zh: "城墙、塔楼与防御建筑"
    role_en: "Walls, towers, and defensive structures"
  iron:
    name_zh: "铁矿"
    name_en: "Iron"
    category: base
    role_key: advanced_military_and_gunpowder
    role_zh: "高级军事装备与火药军需体系"
    role_en: "Advanced military equipment and gunpowder supply"
  arrows:
    name_zh: "箭矢"
    name_en: "Arrows"
    category: military
    produced_from:
      wood: true
    role_zh: "弓弩体系的持续作战资源"
    role_en: "Sustained combat supply for bow and crossbow units"
  gunpowder:
    name_zh: "火药"
    name_en: "Gunpowder"
    category: military
    produced_from:
      iron: true
    role_zh: "火铳、自爆兵和火炮的作战资源"
    role_en: "Combat supply for firearms, suicide bombers, and cannons"

blood_scent:
  name_zh: "血腥值"
  name_en: "Blood Scent"
  zombie_death_radius_tiles: 2
  normal_human_death_radius_tiles: 10
  advanced_human_death_radius_tiles: 15
  infected_building_level_1_radius_tiles: 20
  infected_building_level_2_radius_tiles: 30
  infected_building_level_3_radius_tiles: 40
  decay_enabled: true
  diffusion_enabled: true
  description_zh: "局部死亡与建筑感染产生吸引源，数值越高可吸引越远的僵尸。"
  description_en: "Local deaths and infected buildings create attraction sources; higher values attract zombies from farther away."

player_units:
  wooden_shield_guard:
    name_zh: "木盾兵"
    name_en: "Wooden Shield Guard"
    class: melee
    ammo_type: none
    role_key: expendable_tank
    role_zh: "低成本消耗型前排"
    role_en: "Low-cost expendable frontline tank"
    cost_focus: [food, wood]
  iron_shield_guard:
    name_zh: "铁盾兵"
    name_en: "Iron Shield Guard"
    class: melee
    ammo_type: none
    role_key: heavy_tank
    role_zh: "高耐久重装前排"
    role_en: "High-durability heavy frontline tank"
    cost_focus: [food, iron]
  suicide_bomber:
    name_zh: "自爆兵"
    name_en: "Suicide Bomber"
    class: melee_special
    ammo_type: gunpowder
    role_key: disposable_aoe
    role_zh: "一次性范围杀伤单位"
    role_en: "Disposable area-damage unit"
    cost_focus: [food, gunpowder]
  archer:
    name_zh: "弓箭手"
    name_en: "Archer"
    class: ranged
    ammo_type: arrows
    ammo_per_attack: 1
    role_key: basic_ranged
    role_zh: "基础远程输出"
    role_en: "Basic ranged damage dealer"
    cost_focus: [food, wood]
  repeating_crossbowman:
    name_zh: "连弩手"
    name_en: "Repeating Crossbowman"
    class: ranged
    ammo_type: arrows
    ammo_per_attack: 1
    role_key: high_rate_of_fire
    role_zh: "高射速、高箭矢消耗远程单位"
    role_en: "High-rate-of-fire ranged unit with heavy arrow consumption"
    cost_focus: [food, wood]
  heavy_crossbowman:
    name_zh: "重弩手"
    name_en: "Heavy Crossbowman"
    class: ranged
    ammo_type: arrows
    ammo_per_attack: 1
    role_key: high_single_target_damage
    role_zh: "低射速、高单体伤害远程单位"
    role_en: "Slow-firing ranged unit with high single-target damage"
    cost_focus: [food, wood, iron]
  firearm_infantry:
    name_zh: "神机营"
    name_en: "Firearm Infantry / Shenji Battalion"
    class: ranged
    ammo_type: gunpowder
    ammo_per_attack: 1
    role_key: advanced_ranged
    role_zh: "中后期高伤害火药远程主力"
    role_en: "High-damage mid/late-game gunpowder ranged unit"
    cost_focus: [food, iron]
  heavy_ballista:
    name_zh: "重弩炮"
    name_en: "Heavy Ballista"
    class: siege
    ammo_type: arrows
    ammo_per_attack: 10
    role_key: heavy_projectile
    role_zh: "箭矢体系重型远程武器"
    role_en: "Heavy ranged weapon in the arrow-supply system"
    cost_focus: [wood, iron]
  cannon:
    name_zh: "火炮"
    name_en: "Cannon"
    class: siege
    ammo_type: gunpowder
    ammo_per_attack: 5
    ammo_per_attack_test_range: [5, 10]
    role_key: aoe_siege
    role_zh: "高消耗范围重武器"
    role_en: "High-consumption area heavy weapon"
    cost_focus: [iron]

zombies:
  walker:
    name_zh: "普通僵尸"
    name_en: "Walker"
    speed_tier: very_slow
    hp_tier: low
    damage_tier: low
  runner:
    name_zh: "狂暴僵尸"
    name_en: "Runner"
    speed_tier: fast
    hp_tier: low_medium
    damage_tier: medium
  brute:
    name_zh: "胖尸"
    name_en: "Brute"
    speed_tier: medium
    hp_tier: high
    damage_tier: high
  zombie_hound:
    name_zh: "尸犬"
    name_en: "Zombie Hound"
    speed_tier: very_fast
    hp_tier: low
    damage_tier: medium
    can_vault_low_walls: true
  spitter:
    name_zh: "毒液僵尸"
    name_en: "Spitter"
    speed_tier: medium
    hp_tier: low_medium
    damage_tier: medium
    ranged_attack: true
  giant:
    name_zh: "巨型僵尸"
    name_en: "Giant"
    speed_tier: slow
    hp_tier: very_high
    damage_tier: very_high
    anti_building: true
  boss:
    name_zh: "Boss 僵尸"
    name_en: "Boss Zombie"
    speed_tier: TBD
    hp_tier: TBD
    damage_tier: TBD
    special_rule_zh: "Boss 应改变战场规则，而不是单纯增加生命值。"
    special_rule_en: "Bosses should change battlefield rules rather than simply having more HP."

infection:
  human_killed_by_zombie:
    immediate_spawn: true
    spawned_zombie_type: walker
    spawned_count: TBD
    emits_blood_scent: true
    description_zh: "人类单位被僵尸击杀后立即生成低级僵尸并产生血腥值。"
    description_en: "When a human unit is killed by a zombie, low-tier zombies spawn immediately and Blood Scent is generated."
  infected_buildings:
    level_1:
      name_zh: "一级僵尸巢穴"
      name_en: "Level 1 Zombie Nest"
      spawn_pool: [walker]
      spawn_rate: low
    level_2:
      name_zh: "二级僵尸巢穴"
      name_en: "Level 2 Zombie Nest"
      spawn_pool: [walker, runner]
      spawn_rate: medium
    level_3:
      name_zh: "三级僵尸巢穴"
      name_en: "Level 3 Zombie Nest"
      spawn_pool: [runner, brute]
      spawn_rate: high
      special_zombie_chance: TBD
